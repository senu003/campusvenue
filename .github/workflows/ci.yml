name: CampusVenue CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 10 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/CampusVenue.sln

      - name: Build Backend (Release)
        run: dotnet build backend/CampusVenue.sln --no-restore -c Release

      - name: Run Backend Tests
        run: dotnet test backend/CampusVenue.sln --no-build -c Release --verbosity normal

  frontend-ci:
    name: Frontend Lint, Test & Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Build Frontend SPA
        run: npm run build

  infra-ci:
    name: Docker & Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet
